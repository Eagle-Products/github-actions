
name: PR Check Node.js UAT

on:
  workflow_call:
    inputs:
      org_name:
        description: Organization name
        required: true
        type: string

      VERSION_NUMBER:
        description: UAT Docker image version
        required: true
        type: string

    secrets:
      NODE_AUTH_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, Test and Publish UAT Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ inputs.org_name }}'

      # 3. Configure GitHub Packages authentication
      - name: Configure npm authentication
        run: |
          echo "@${{ inputs.org_name }}:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # 4. Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 5. Run tests and generate coverage
      - name: Run tests
        run: yarn test:cov

      # 6. Upload coverage report
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2

      # 7. Configure QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 8. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9. Authenticate with GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Generate Docker image metadata
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.VERSION_NUMBER }}

      # 11. Build and publish UAT Docker image
      - name: Build and push UAT Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}