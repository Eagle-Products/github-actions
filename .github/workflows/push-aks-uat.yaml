
name: Reusable UAT AKS Deployment

on:
  workflow_call:
    inputs:
      VERSION_NUMBER:
        description: "Container image version to deploy"
        required: true
        type: string

      deployment_name:
        description: "Kubernetes Deployment name"
        required: true
        type: string

      deployment_manifest:
        description: "Path to the Deployment manifest"
        required: true
        type: string

      config_manifest:
        description: "Optional ConfigMap and Secret manifest"
        required: false
        type: string
        default: ""

      additional_manifests:
        description: "Additional Service and Ingress manifest paths, one per line"
        required: false
        type: string
        default: ""

    secrets:
      AZURE_CREDENTIALS:
        required: true
      resource_group:
        required: true
      cluster_name:
        required: true
      name_space:
        required: true

permissions:
  contents: read

jobs:
  push-aks:
    name: Deploy Application to UAT AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Step 1: Validate deployment inputs (Diagnostic)
      # --------------------------------------------------

      - name: Validate deployment inputs
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          DEPLOYMENT_MANIFEST: ${{ inputs.deployment_manifest }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}
          RESOURCE_GROUP: ${{ secrets.resource_group }}
          CLUSTER_NAME: ${{ secrets.cluster_name }}
          NAMESPACE: ${{ secrets.name_space }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail

          check_required() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is empty or was not passed."
              exit 1
            fi

            echo "$name is present."
          }

          check_file() {
            local name="$1"
            local path="$2"

            if [ ! -f "$path" ]; then
              echo "::error::$name does not exist: $path"
              exit 1
            fi

            echo "$name exists: $path"
          }

          check_required "DEPLOYMENT_NAME" "$DEPLOYMENT_NAME"
          check_required "VERSION_NUMBER" "$VERSION_NUMBER"
          check_required "RESOURCE_GROUP" "$RESOURCE_GROUP"
          check_required "CLUSTER_NAME" "$CLUSTER_NAME"
          check_required "NAMESPACE" "$NAMESPACE"
          check_required "AZURE_CREDENTIALS" "$AZURE_CREDENTIALS"

          check_file "Deployment manifest" "$DEPLOYMENT_MANIFEST"

          if [ -n "$CONFIG_MANIFEST" ]; then
            check_file "Config manifest" "$CONFIG_MANIFEST"
          else
            echo "No config manifest supplied."
          fi

          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            check_file "Additional manifest" "$manifest"
          done <<< "$ADDITIONAL_MANIFESTS"

          if [[ "$VERSION_NUMBER" == *REPLACE* ]]; then
            echo "::error::Invalid image version."
            exit 1
          fi

          echo "All deployment inputs validated."

      # --------------------------------------------------
      # Step 2: Azure Login
      # --------------------------------------------------

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------
      # Step 3: Set AKS Context
      # --------------------------------------------------

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.resource_group }}
          cluster-name: ${{ secrets.cluster_name }}

      # --------------------------------------------------
      # Step 4: Setup kubectl
      # --------------------------------------------------

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # --------------------------------------------------
      # Step 5: Install envsubst
      # --------------------------------------------------

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      # --------------------------------------------------
      # Step 6: Render Deployment Manifest
      # --------------------------------------------------

      - name: Render Deployment manifest
        shell: bash
        env:
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}
          DEPLOYMENT_MANIFEST: ${{ inputs.deployment_manifest }}
        run: |
          set -euo pipefail

          mkdir -p rendered

          envsubst '${VERSION_NUMBER}' \
            < "$DEPLOYMENT_MANIFEST" \
            > rendered/deployment.yaml

          echo "Rendered image:"
          grep 'image:' rendered/deployment.yaml

          if grep -q '${VERSION_NUMBER}' rendered/deployment.yaml; then
            echo "::error::Unresolved VERSION_NUMBER placeholder"
            exit 1
          fi

      # --------------------------------------------------
      # Step 7: Validate Kubernetes Manifests
      # --------------------------------------------------

      - name: Validate Kubernetes manifests
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
        run: |
          set -euo pipefail

          if [ -n "$CONFIG_MANIFEST" ]; then
            kubectl apply --dry-run=server \
              -n "$NAMESPACE" \
              -f "$CONFIG_MANIFEST"
          fi

          kubectl apply --dry-run=server \
            -n "$NAMESPACE" \
            -f rendered/deployment.yaml

          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue

            kubectl apply --dry-run=server \
              -n "$NAMESPACE" \
              -f "$manifest"
          done <<< "$ADDITIONAL_MANIFESTS"

      # --------------------------------------------------
      # Step 8: Apply Application Configuration
      # --------------------------------------------------

      - name: Apply application configuration
        if: ${{ inputs.config_manifest != '' }}
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
        run: |
          set -euo pipefail

          kubectl apply \
            -n "$NAMESPACE" \
            -f "$CONFIG_MANIFEST"

      # --------------------------------------------------
      # Step 9: Deploy Application
      # --------------------------------------------------

      - name: Deploy application
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
        run: |
          set -euo pipefail

          kubectl apply \
            -n "$NAMESPACE" \
            -f rendered/deployment.yaml

          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue

            kubectl apply \
              -n "$NAMESPACE" \
              -f "$manifest"
          done <<< "$ADDITIONAL_MANIFESTS"

      # --------------------------------------------------
      # Step 10: Verify Deployment Rollout
      # --------------------------------------------------

      - name: Verify Deployment rollout
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail

          kubectl rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            --timeout=300s

      # --------------------------------------------------
      # Step 11: Verify Kubernetes Resources
      # --------------------------------------------------

      - name: Verify Kubernetes resources
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail

          echo "===== Deployment ====="
          kubectl get deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE"

          echo "===== Pods ====="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "===== Services ====="
          kubectl get services -n "$NAMESPACE"

          echo "===== Endpoints ====="
          kubectl get endpoints -n "$NAMESPACE"

          echo "===== Ingress ====="
          kubectl get ingress -n "$NAMESPACE"



