
name: Reusable UAT AKS Deployment

on:
  workflow_call:
    inputs:
      VERSION_NUMBER:
        description: "Container image version to deploy"
        required: true
        type: string

      deployment_name:
        description: "Kubernetes Deployment name"
        required: true
        type: string

      deployment_manifest:
        description: "Path to the Kubernetes Deployment manifest"
        required: true
        type: string

      config_manifest:
        description: "Optional application ConfigMap/Secret manifest"
        required: false
        type: string
        default: ""

      additional_manifests:
        description: "Additional Kubernetes manifest paths, one per line"
        required: false
        type: string
        default: ""

    secrets:
      AZURE_CREDENTIALS:
        required: true
      resource_group:
        required: true
      cluster_name:
        required: true
      name_space:
        required: true

permissions:
  contents: read

jobs:
  push-aks:
    name: Deploy Application to UAT AKS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # Step 1: Checkout application repository
      # --------------------------------------------------

      - name: Checkout application repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Step 2: Validate deployment inputs and files
      # --------------------------------------------------

      - name: Validate deployment inputs
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          DEPLOYMENT_MANIFEST: ${{ inputs.deployment_manifest }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}
          RESOURCE_GROUP: ${{ secrets.resource_group }}
          CLUSTER_NAME: ${{ secrets.cluster_name }}
          NAMESPACE: ${{ secrets.name_space }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail

          check_required() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::$name is empty or was not passed by the caller workflow."
              exit 1
            fi

            echo "$name is present."
          }

          check_file() {
            local name="$1"
            local path="$2"

            if [[ ! -f "$path" ]]; then
              echo "::error::$name does not exist: $path"
              exit 1
            fi

            echo "$name exists: $path"
          }

          check_required "DEPLOYMENT_NAME" "$DEPLOYMENT_NAME"
          check_required "VERSION_NUMBER" "$VERSION_NUMBER"
          check_required "RESOURCE_GROUP" "$RESOURCE_GROUP"
          check_required "CLUSTER_NAME" "$CLUSTER_NAME"
          check_required "NAMESPACE" "$NAMESPACE"
          check_required "AZURE_CREDENTIALS" "$AZURE_CREDENTIALS"

          check_file "Deployment manifest" "$DEPLOYMENT_MANIFEST"

          if [[ -n "$CONFIG_MANIFEST" ]]; then
            check_file "Configuration manifest" "$CONFIG_MANIFEST"
          fi

          while IFS= read -r manifest || [[ -n "$manifest" ]]; do
            manifest="${manifest%$'\r'}"

            [[ -z "$manifest" ]] && continue

            check_file "Additional manifest" "$manifest"
          done <<< "$ADDITIONAL_MANIFESTS"

          if [[ "$VERSION_NUMBER" == *REPLACE* ]]; then
            echo "::error::Invalid image version: unresolved placeholder."
            exit 1
          fi

          echo "All deployment inputs validated."

      # --------------------------------------------------
      # Step 3: Azure Login
      # --------------------------------------------------

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------
      # Step 4: Verify Azure subscription and AKS access
      # --------------------------------------------------

      - name: Verify Azure and AKS access
        shell: bash
        env:
          RESOURCE_GROUP: ${{ secrets.resource_group }}
          CLUSTER_NAME: ${{ secrets.cluster_name }}
        run: |
          set -euo pipefail

          echo "Verifying Azure account..."

          az account show \
            --query "{subscription:name, tenant:tenantId}" \
            --output table

          echo "Verifying AKS cluster..."

          az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --query "{name:name, location:location, provisioningState:provisioningState}" \
            --output table

      # --------------------------------------------------
      # Step 5: Set AKS Context
      # --------------------------------------------------

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.resource_group }}
          cluster-name: ${{ secrets.cluster_name }}

      # --------------------------------------------------
      # Step 6: Setup kubectl
      # --------------------------------------------------

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # --------------------------------------------------
      # Step 7: Verify Kubernetes context and namespace
      # --------------------------------------------------

      - name: Verify Kubernetes access
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
        run: |
          set -euo pipefail

          echo "Kubernetes context:"
          kubectl config current-context

          echo "Kubernetes client version:"
          kubectl version --client

          echo "Checking namespace..."

          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::Namespace '$NAMESPACE' does not exist or is inaccessible."
            exit 1
          fi

          echo "Namespace '$NAMESPACE' is accessible."

          kubectl get namespace "$NAMESPACE"

      # --------------------------------------------------
      # Step 8: Install envsubst
      # --------------------------------------------------

      - name: Install envsubst
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y gettext-base

          command -v envsubst

      # --------------------------------------------------
      # Step 9: Render Deployment manifest
      # --------------------------------------------------

      - name: Render Deployment manifest
        shell: bash
        env:
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}
          DEPLOYMENT_MANIFEST: ${{ inputs.deployment_manifest }}
        run: |
          set -euo pipefail

          mkdir -p rendered

          envsubst '${VERSION_NUMBER}' \
            < "$DEPLOYMENT_MANIFEST" \
            > rendered/deployment.yaml

          echo "Rendered container image references:"

          grep -n 'image:' rendered/deployment.yaml

          if grep -q '${VERSION_NUMBER}' rendered/deployment.yaml; then
            echo "::error::Unresolved VERSION_NUMBER placeholder."
            exit 1
          fi

          if grep -q 'image:.*REPLACE' rendered/deployment.yaml; then
            echo "::error::Invalid image placeholder remains in manifest."
            exit 1
          fi

          echo "Deployment manifest rendered successfully."

      # --------------------------------------------------
      # Step 10: Validate Kubernetes manifests
      # --------------------------------------------------

      - name: Validate Kubernetes manifests
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
        run: |
          set -euo pipefail

          echo "Validating configuration manifest..."

          if [[ -n "$CONFIG_MANIFEST" ]]; then
            kubectl apply \
              --dry-run=server \
              -n "$NAMESPACE" \
              -f "$CONFIG_MANIFEST"
          fi

          echo "Validating Deployment manifest..."

          kubectl apply \
            --dry-run=server \
            -n "$NAMESPACE" \
            -f rendered/deployment.yaml

          echo "Validating additional manifests..."

          while IFS= read -r manifest || [[ -n "$manifest" ]]; do
            manifest="${manifest%$'\r'}"

            [[ -z "$manifest" ]] && continue

            kubectl apply \
              --dry-run=server \
              -n "$NAMESPACE" \
              -f "$manifest"

          done <<< "$ADDITIONAL_MANIFESTS"

          echo "All Kubernetes manifests passed server-side validation."

      # --------------------------------------------------
      # Step 11: Apply application configuration
      # --------------------------------------------------

      - name: Apply application configuration
        if: ${{ inputs.config_manifest != '' }}
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          CONFIG_MANIFEST: ${{ inputs.config_manifest }}
        run: |
          set -euo pipefail

          echo "Applying application configuration..."

          kubectl apply \
            -n "$NAMESPACE" \
            -f "$CONFIG_MANIFEST"

          echo "Application configuration applied."

      # --------------------------------------------------
      # Step 12: Deploy application and additional resources
      # --------------------------------------------------

      - name: Deploy application
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          ADDITIONAL_MANIFESTS: ${{ inputs.additional_manifests }}
        run: |
          set -euo pipefail

          echo "Applying Deployment manifest..."

          kubectl apply \
            -n "$NAMESPACE" \
            -f rendered/deployment.yaml

          echo "Applying additional manifests..."

          while IFS= read -r manifest || [[ -n "$manifest" ]]; do
            manifest="${manifest%$'\r'}"

            [[ -z "$manifest" ]] && continue

            kubectl apply \
              -n "$NAMESPACE" \
              -f "$manifest"

          done <<< "$ADDITIONAL_MANIFESTS"

          echo "Application resources applied."

      # --------------------------------------------------
      # Step 13: Verify Deployment rollout
      # --------------------------------------------------

      - name: Verify Deployment rollout
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail

          echo "Waiting for Deployment rollout..."

          kubectl rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            --timeout=300s

          echo "Deployment rollout completed successfully."

      # --------------------------------------------------
      # Step 14: Verify Deployment availability
      # --------------------------------------------------

      - name: Verify Deployment availability
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail

          READY_REPLICAS="$(
            kubectl get deployment "$DEPLOYMENT_NAME" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}'
          )"

          DESIRED_REPLICAS="$(
            kubectl get deployment "$DEPLOYMENT_NAME" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.replicas}'
          )"

          READY_REPLICAS="${READY_REPLICAS:-0}"
          DESIRED_REPLICAS="${DESIRED_REPLICAS:-0}"

          echo "Desired replicas: $DESIRED_REPLICAS"
          echo "Ready replicas: $READY_REPLICAS"

          if [[ "$DESIRED_REPLICAS" -eq 0 || "$READY_REPLICAS" -lt "$DESIRED_REPLICAS" ]]; then
            echo "::error::Deployment does not have all desired replicas Ready."
            exit 1
          fi

          echo "All desired replicas are Ready."

      # --------------------------------------------------
      # Step 15: Display Kubernetes resources
      # --------------------------------------------------

      - name: Verify Kubernetes resources
        shell: bash
        env:
          NAMESPACE: ${{ secrets.name_space }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "DEPLOYMENT"
          echo "======================================"

          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            -o wide

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get services \
            -n "$NAMESPACE"

          echo "======================================"
          echo "ENDPOINTS"
          echo "======================================"

          kubectl get endpoints \
            -n "$NAMESPACE"

          echo "======================================"
          echo "INGRESS"
          echo "======================================"

          kubectl get ingress \
            -n "$NAMESPACE"

          echo "======================================"
          echo "PERSISTENT VOLUME CLAIMS"
          echo "======================================"

          kubectl get pvc \
            -n "$NAMESPACE"

          echo "======================================"
          echo "DEPLOYMENT VERIFICATION COMPLETE"
          echo "======================================"



