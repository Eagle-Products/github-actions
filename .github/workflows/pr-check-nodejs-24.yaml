name: Pre Pull Request Check Nodejs

on:
  workflow_call:
    inputs:
      VERSION_NUMBER:
        default: master
        type: string
      org_name:
        required: true
        type: string
    secrets:
      NODE_AUTH_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepr-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create NPMRC
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@${ORG_NAME}:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo 'registry "https://registry.yarnpkg.com"' >> ~/.yarnrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          ORG_NAME: ${{ inputs.org_name }}

      - name: Yarn Install
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Run tests
        if: always()
        run: yarn test:cov

      - name: Coveralls
        uses: romeovs/lcov-reporter-action@v0.2.21
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info

      - name: Check is template repo
        id: check_template_repo
        uses: andstor/file-existence-action@v1
        with:
          files: ".template_repo"

      - name: Configure Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ inputs.org_name }}'

      - name: Configure git user
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # Publish to GitHub Packages

      - name: Publish to GitHub Packages - PR
        if: steps.check_template_repo.outputs.files_exists == 'false' && github.event_name == 'pull_request'
        run: yarn release --canary --preid pr${{ github.event.number }}bld${{ github.run_number }} --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Publish to GitHub Packages - Release
        if: steps.check_template_repo.outputs.files_exists == 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: yarn release --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  docker-build:
    name: Docker Build
    needs: [prepr-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check is template repo
        id: check_template_repo
        uses: andstor/file-existence-action@v1
        with:
          files: ".template_repo"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ inputs.VERSION_NUMBER }},enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/master-prod' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render Deployment YAML TMP
        uses: nowactions/envsubst@v1
        with:
          input: ./k8s/app-deployment.yaml
          output: ./app-deployment.yaml.tmp
        env:
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}

      - name: Render Deployment YAML
        uses: nowactions/envsubst@v1
        with:
          input: ./app-deployment.yaml.tmp
          output: ./k8s/app-deployment.yaml
        env:
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.check_template_repo.outputs.files_exists == 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.NODE_AUTH_TOKEN }}
        env:
          VERSION_NUMBER: ${{ inputs.VERSION_NUMBER }}
